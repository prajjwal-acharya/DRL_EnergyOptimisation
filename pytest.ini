[pytest]
testpaths = tests

# Third-party import-time noise only - the project's own code raises no
# warnings (decision recorded 2026-09-01; see docs/status/issues.md).
#
# 1) macOS system Python 3.9 links its ssl module against LibreSSL 2.8.3,
#    and urllib3 v2 warns it only supports OpenSSL 1.1.1+ (urllib3 issue
#    3020). Harmless here: the project makes no network calls at runtime -
#    scripts/01_fetch_pinned_dataset.py primes all data locally.
#
# 2) matplotlib 3.9.4 (the newest release supporting Python 3.9) still calls
#    the pyparsing 2.x camelCase aliases that pyparsing 3.x deprecates. They
#    are working compatibility aliases; the fix exists only in matplotlib
#    3.10+, which requires Python >= 3.10. Revisit these filters whenever
#    the pinned environment is deliberately upgraded.
# The urllib3 filter is message-based because the warning fires at
# collection-time import, before class-path filters are installed.
filterwarnings =
    ignore:urllib3 v2 only supports OpenSSL
    ignore::pyparsing.warnings.PyparsingDeprecationWarning
